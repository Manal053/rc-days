<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC Days Riyadh</title>
<meta name="description" content="Discover RC Days Riyadh, a community celebrating radio-controlled cars, racing, drift, off-road activities, competitions, and unforgettable community events.">
<meta name="description" lang="ar" content="اكتشف RC Days Riyadh، مجتمع شغوف بعالم السيارات اللاسلكية والسباقات والدرفت والأوف رود والفعاليات والتجمعات.">
<meta property="og:title" content="RC Days Riyadh — Small cars. Big passion.">
<meta property="og:description" content="Discover RC Days Riyadh, a community celebrating radio-controlled cars, racing, drift, off-road activities, competitions, and unforgettable community events.">
<meta property="og:type" content="website">
<meta property="og:image" content="img/logo.png">
<meta name="theme-color" content="#0d0d0e">
<link rel="icon" href="img/logo-160.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: motorsport magazine — loud headline, calm body, every fact traced to an RC Days post.
   IDEA: a race programme from the Riyadh sand: poster, results board, paddock photos.
   PICTURE: a collage of RC Days' own championship poster and community shots.
   COLOUR and TYPE: matte black + charcoal, white ink, racing red, logo blue as a small second accent; Barlow Condensed / Cairo.
   LAYOUT: sticky nav (bottom bar on phones), full-bleed black bands, editorial cards and a timeline. */
:root{color-scheme:dark;--bg:#0d0d0e;--panel:#17171a;--line:#2a2a2f;--ink:#f4f4f2;--mute:#a3a3a8;--red:#e3122d;--red2:#ff4458;--blue:#3d8bff;
--disp:"Barlow Condensed","Cairo",Impact,sans-serif;--body:"Barlow","Cairo",system-ui,sans-serif}
:root[dir=rtl]{--disp:"Cairo","Barlow Condensed",sans-serif;--body:"Cairo",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);overflow-x:clip}
a{color:inherit}
img{max-width:100%;display:block}
.band{padding:clamp(48px,7vw,96px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--disp);line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(46px,8.5vw,100px);font-weight:800;text-transform:uppercase}
[dir=rtl] h1{text-transform:none;line-height:1.25}
h2{font-size:clamp(32px,5vw,52px);font-weight:800}
[dir=rtl] h2{line-height:1.3}
h3{font-size:24px;font-weight:600}
[dir=rtl] h3{line-height:1.4}
p{margin:.6em 0;max-width:66ch}
.mute{color:var(--mute)}
.kick{font-family:var(--disp);color:var(--red2);font-size:18px;font-weight:600;margin:0 0 12px}
header{position:sticky;top:0;z-index:20;background:rgba(13,13,14,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;max-width:1240px;margin:0 auto;padding:8px max(5vw,16px)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo img{width:46px;height:46px}
.logo b{font:800 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em}
.links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.links a{flex:none;text-decoration:none;padding:10px 12px;border-radius:8px;color:var(--mute);font-weight:600;font-size:15px}
.links a:hover,.links a:focus-visible{color:var(--ink);background:var(--panel)}
.lang{flex:none;margin-inline-start:auto;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 16px var(--body);cursor:pointer}
.lang:hover{background:var(--ink);color:var(--bg)}
:focus-visible{outline:3px solid var(--red2);outline-offset:2px}
@media(max-width:860px){header{backdrop-filter:none;background:#0d0d0e}
 .links{position:fixed;inset:auto 0 0 0;background:#0d0d0e;border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:30}
 body{padding-bottom:64px}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;padding-top:clamp(24px,4vw,64px)}
.hero .lede{font-size:clamp(18px,2vw,21px);color:#d8d8da}
.tagline{display:inline-block;font:italic 600 16px "Barlow",sans-serif;color:var(--blue);margin-bottom:10px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid var(--line)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn svg{width:20px;height:20px;flex:none}
.collage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:1fr 1fr;gap:10px;aspect-ratio:1/1}
.collage figure{margin:0;position:relative;border-radius:16px;overflow:hidden;background:#1d1d21}
.collage figure:first-child{grid-row:span 2}
.collage img{width:100%;height:100%;object-fit:cover;animation:rise .9s ease-out both}
.collage figure:nth-child(2) img{animation-delay:.12s}.collage figure:nth-child(3) img{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){.collage img{animation:none}html{scroll-behavior:auto}}
.chip{position:absolute;inset-block-end:10px;inset-inline-start:10px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff}
.chip.red{background:var(--red)}
.strip{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--disp);font-size:20px;font-weight:600;color:var(--mute)}
.strip span::before{content:"";display:inline-block;width:8px;height:8px;background:var(--red);transform:skewX(-20deg);margin-inline-end:10px;vertical-align:middle}
@media(max-width:760px){.hero{grid-template-columns:1fr}.collage{order:-1}}
.alt{background:var(--panel)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:18px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.alt .card{background:#111113}
.card .pic{aspect-ratio:4/3;background:#1d1d21;position:relative}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .in{padding:18px 20px 22px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .in p{margin:0;color:#cfcfd2;font-size:16px}
.go{margin-top:auto;padding-top:12px;color:var(--red2);font-weight:600;text-decoration:none}
.go:hover{text-decoration:underline}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.list{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
.list li{padding:14px 18px;border-inline-start:3px solid var(--red);background:var(--bg);border-radius:0 10px 10px 0}
[dir=rtl] .list li{border-radius:10px 0 0 10px}
.badgeLogo{width:min(260px,70%);margin:0 auto 22px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.draft{border:1px dashed #5a5a60;border-radius:16px;padding:22px}
.badge{display:inline-block;font-size:13px;font-weight:600;background:#3a2a00;color:#ffd166;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.empty{border:1px solid var(--line);border-radius:20px;padding:clamp(26px,5vw,56px);text-align:center;background:radial-gradient(120% 140% at 50% 0%,#2a0d12 0%,var(--bg) 60%)}
.empty p{margin:0 auto 22px;font-size:clamp(20px,2.4vw,26px);font-family:var(--disp);font-weight:600}
.empty .ctas{justify-content:center}
.empty small{display:block;margin-top:18px;color:var(--mute)}
.empty small a{color:var(--red2)}
.tl{display:grid;gap:22px}
.ev{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);background:#111113;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ev .pic{position:relative;background:#1d1d21;min-height:220px}
.ev .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.ev .in{padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:4px 0;font-size:15px}
.facts dt{color:var(--mute)}.facts dd{margin:0}
.ph{color:#ffd166}
@media(max-width:700px){.ev{grid-template-columns:1fr}.ev .pic{min-height:0}.ev .pic img{position:static;height:auto}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chips button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);font:600 15px var(--body);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vid{text-decoration:none;display:flex;flex-direction:column;background:#111113;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.vid .pic{aspect-ratio:16/9;position:relative;background:#1d1d21}
.vid .pic img{width:100%;height:100%;object-fit:cover}
.vid .play{position:absolute;inset:0;margin:auto;width:60px;height:60px;border-radius:50%;background:rgba(227,18,45,.92);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(227,18,45,.22)}
.vid:hover .play{background:var(--red2)}
.vid .in{padding:14px 16px 18px;display:flex;flex-direction:column;gap:4px}
.vid h3{font-size:19px;font-family:"Cairo",sans-serif;line-height:1.5}
.vid p{margin:0;font-size:15px}
.gal{columns:2;column-gap:12px}@media(min-width:760px){.gal{columns:3}}
.gal button{display:block;width:100%;margin:0 0 12px;break-inside:avoid;border:0;border-radius:14px;cursor:zoom-in;position:relative;overflow:hidden;background:#1d1d21;padding:0}
.gal img{width:100%;height:auto}
.gal button:hover img{transform:scale(1.03)}.gal img{transition:transform .4s}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:50;padding:20px}
.lb.on{display:grid}
.lb figure{margin:0;max-width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column;gap:10px}
.lb img{max-height:80vh;width:auto;margin:0 auto;border-radius:12px}
.lb figcaption{text-align:center;color:#ddd}
.lb .x{position:absolute;inset-block-start:16px;inset-inline-end:16px;width:48px;height:48px;border-radius:50%;border:1px solid #555;background:#111;color:#fff;font-size:24px;cursor:pointer}
.soc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
.soc a,.soc div{display:flex;align-items:center;gap:16px;padding:22px;border-radius:16px;background:var(--bg);border:1px solid var(--line);text-decoration:none}
.soc a:hover{border-color:var(--red)}
.soc svg{width:42px;height:42px;flex:none}
.soc b{display:block;font-size:20px}
.soc div{border-style:dashed}
footer{padding:36px max(5vw,16px);border-top:1px solid var(--line);color:var(--mute);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
</style>
</head>
<body>
<header>
 <div class="bar">
  <a class="logo" href="#home" aria-label="RC Days Riyadh"><img src="img/logo-160.png" alt="RC Days logo" width="46" height="46"><b>RC DAYS</b></a>
  <nav class="links" id="nav" aria-label="Sections"></nav>
  <button class="lang" id="lang" type="button" lang="ar">العربية</button>
 </div>
</header>

<main>
<section class="band" id="home">
 <div class="wrap hero">
  <div>
   <span class="tagline">we are PROFESSIONALS</span>
   <p class="kick" data-t="heroKick"></p>
   <h1 data-t="heroTitle"></h1>
   <p class="lede" data-t="heroLede"></p>
   <div class="ctas">
    <a class="btn red" href="#upcoming" data-t="ctaEvents"></a>
    <a class="btn ghost" href="https://www.youtube.com/@RC_days" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path fill="#e3122d" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .6 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .4-4.8 31 31 0 0 0-.4-4.8z"/><path fill="#fff" d="M9.8 15.1 15.6 12 9.8 8.9z"/></svg><span data-t="ctaYT"></span></a>
   </div>
  </div>
  <div class="collage">
   <figure><img src="img/poster-sand-hill.jpg" data-alt="altSandHill"></figure>
   <figure><img src="img/g-drift-car.jpg" data-alt="altDrift"><span class="chip" data-t="chipDrift"></span></figure>
   <figure><img src="img/g-land-cruiser-crawler.jpg" data-alt="altCrawler"><span class="chip" data-t="chipCrawler"></span></figure>
  </div>
 </div>
 <div class="wrap"><div class="strip" id="strip"></div></div>
</section>

<section class="band alt" id="about">
 <div class="wrap two">
  <div>
   <p class="kick" data-t="aboutKick"></p>
   <h2 data-t="aboutTitle"></h2>
   <p data-t="aboutP1"></p>
   <p data-t="aboutP2"></p>
   <p class="mute" data-t="aboutP3"></p>
   <ul class="list" id="doList"></ul>
  </div>
  <div>
   <img class="badgeLogo" src="img/logo.png" alt="RC Days official logo — we are PROFESSIONALS">
   <div class="draft">
    <span class="badge" data-t="draftBadge"></span>
    <h3 data-t="visionT"></h3>
    <p data-t="visionP"></p>
    <h3 style="margin-top:18px" data-t="valuesT"></h3>
    <ul class="list" id="values"></ul>
   </div>
  </div>
 </div>
</section>

<section class="band" id="activities">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="actKick"></p><h2 data-t="actTitle"></h2></div><p class="mute" data-t="actNote"></p></div>
  <div class="grid" id="acts"></div>
 </div>
</section>

<section class="band alt" id="upcoming">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="upKick"></p><h2 data-t="upTitle"></h2></div></div>
  <div id="upList"></div>
 </div>
</section>

<section class="band" id="past">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="pastKick"></p><h2 data-t="pastTitle"></h2></div></div>
  <div class="tl" id="pastList"></div>
 </div>
</section>

<section class="band alt" id="videos">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="vidKick"></p><h2 data-t="vidTitle"></h2></div><a class="btn ghost" href="https://www.youtube.com/@RC_days/videos" target="_blank" rel="noopener" data-t="vidAll"></a></div>
  <div class="chips" id="vidChips" role="group"></div>
  <div class="grid" id="vidList"></div>
 </div>
</section>

<section class="band" id="gallery">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="galKick"></p><h2 data-t="galTitle"></h2></div><p class="mute" data-t="galNote"></p></div>
  <div class="chips" id="galChips" role="group"></div>
  <div class="gal" id="gal"></div>
 </div>
</section>

<section class="band alt" id="community">
 <div class="wrap two">
  <div><p class="kick" data-t="comKick"></p><h2 data-t="comTitle"></h2><p data-t="comP"></p><p class="mute" data-t="comPrivacy"></p></div>
  <ul class="list" id="comList"></ul>
 </div>
</section>

<section class="band" id="contact">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="conKick"></p><h2 data-t="conTitle"></h2></div></div>
  <div class="soc">
   <a href="https://www.instagram.com/rc_days" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="#f4f4f2" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="#e3122d" stroke="none"/></svg><span><b>Instagram</b><span class="mute">@rc_days</span></span></a>
   <a href="https://www.youtube.com/@RC_days" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path fill="#e3122d" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .6 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .4-4.8 31 31 0 0 0-.4-4.8z"/><path fill="#fff" d="M9.8 15.1 15.6 12 9.8 8.9z"/></svg><span><b>YouTube</b><span class="mute">@RC_days</span></span></a>
   <div><svg viewBox="0 0 24 24" fill="none" stroke="#a3a3a8" stroke-width="1.8"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7Z"/></svg><span><b>WhatsApp</b><span class="ph" data-t="waPh"></span></span></div>
  </div>
  <p class="mute" style="margin-top:22px" data-t="conNote"></p>
 </div>
</section>
</main>

<footer><div class="wrap"><span data-t="footC"></span><span data-t="footImg"></span></div></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true"><figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure><button class="x" id="lbX" type="button" aria-label="Close">×</button></div>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ids=["home","about","activities","upcoming","past","videos","gallery","community","contact"];
const $=id=>document.getElementById(id);
let L="en",vf="all",gf="all";
try{const s=localStorage.getItem("rcdays-lang");if(s==="ar"||s==="en")L=s}catch(e){}
const ext='target="_blank" rel="noopener"';
const vUrl=v=>v.id?"https://www.youtube.com/watch?v="+encodeURIComponent(v.id):"https://www.youtube.com/@RC_days/videos";
const chips=(el,cats,cur)=>{$(el).innerHTML=Object.keys(cats).map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===cur}">${esc(cats[k])}</button>`).join("")};

function renderVideos(){const t=T[L];chips("vidChips",t.vcats,vf);
 $("vidList").innerHTML=VIDEOS.filter(v=>vf==="all"||v.cat===vf).map(v=>`<a class="vid" href="${vUrl(v)}" ${ext}><div class="pic">${v.img?`<img src="${v.img}" alt="${esc(v[L])}" >`:""}<span class="play"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M8 5v14l11-7z" fill="#fff"/></svg></span></div><div class="in"><h3 lang="ar" dir="rtl">${esc(v.ar)}</h3>${L==="en"?`<p class="mute">${esc(v.en)}</p>`:""}<p class="mute">${v.len?esc(v.len)+" · ":""}${esc(t.vcats[v.cat])}</p></div></a>`).join("")}
function renderGal(){const t=T[L];chips("galChips",t.gcats,gf);
 $("gal").innerHTML=PHOTOS.map((p,i)=>({p,i})).filter(o=>gf==="all"||o.p.cat===gf).map(({p,i})=>`<button type="button" data-i="${i}"><img src="${p.img}" alt="${esc(p[L])}" ></button>`).join("")}

function render(){
 const t=T[L];
 document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
 document.title=L==="ar"?"RC Days Riyadh | ارسي دايز الرياض":"RC Days Riyadh";
 document.querySelectorAll("[data-t]").forEach(el=>{const k=el.dataset.t;if(typeof t[k]==="string")el.textContent=t[k]});
 document.querySelectorAll("[data-alt]").forEach(el=>el.alt=t[el.dataset.alt]);
 $("lang").textContent=t.langBtn;$("lang").lang=L==="ar"?"en":"ar";
 $("nav").innerHTML=ids.map((id,i)=>`<a href="#${id}">${esc(t.nav[i])}</a>`).join("");
 $("strip").innerHTML=t.strip.map(s=>`<span>${esc(s)}</span>`).join("");
 for(const k of ["doList","values","comList"])$(k).innerHTML=t[k].map(s=>`<li>${esc(s)}</li>`).join("");
 $("acts").innerHTML=t.acts.map(([img,h,p])=>`<article class="card"><div class="pic"><img src="${img}" alt="${esc(h)}" ></div><div class="in"><h3>${esc(h)}</h3><p>${esc(p)}</p><a class="go" href="https://www.instagram.com/rc_days" ${ext}>${esc(t.follow)} →</a></div></article>`).join("")
  +`<article class="card" style="border-style:dashed;background:transparent"><div class="in"><h3>${esc(t.alsoT)}</h3><p>${esc(t.alsoP)}</p><a class="go" href="https://www.youtube.com/@RC_days" ${ext}>${esc(t.watch)} →</a></div></article>`;
 const evHTML=e=>{const x=e[L],v=s=>s?esc(s):`<span class="ph">${esc(t.tbc)}</span>`;return `<article class="ev"><div class="pic"><img src="${e.img}" alt="${esc(x.t)}" ></div><div class="in"><h3>${esc(x.t)}</h3><dl class="facts"><dt>${esc(t.fDate)}</dt><dd>${v(x.date)}</dd><dt>${esc(t.fLoc)}</dt><dd>${v(x.loc)}</dd>${x.classes?`<dt>${esc(t.fClass)}</dt><dd>${esc(x.classes)}</dd>`:""}<dt>${esc(t.fRes)}</dt><dd>${x.res?esc(x.res):`<span class="ph">${esc(t.resPh)}</span>`}</dd></dl><p>${esc(x.d)}</p><a class="go" href="${esc(e.link)}" ${ext}>${esc(e.src==="yt"?t.srcYt:t.srcIg)}</a></div></article>`};
 $("upList").innerHTML=UPCOMING.length?`<div class="tl">${UPCOMING.map(evHTML).join("")}</div>`
  :`<div class="empty"><p>${esc(t.upEmpty)}</p><div class="ctas"><a class="btn red" href="https://www.instagram.com/rc_days" ${ext}>${esc(t.follow)}</a><a class="btn ghost" href="https://www.youtube.com/@RC_days" ${ext}>${esc(t.watch)}</a></div><small>${esc(t.upLast)} <a href="#past">${esc(t.upLastLink)}</a></small></div>`;
 $("pastList").innerHTML=PAST.map(evHTML).join("");
 renderVideos();renderGal();
 $("lbX").setAttribute("aria-label",t.close);
}
function setLang(n){const y=window.scrollY;L=n;try{localStorage.setItem("rcdays-lang",n)}catch(e){}render();window.scrollTo(0,y)}
$("lang").addEventListener("click",()=>setLang(L==="en"?"ar":"en"));
$("vidChips").addEventListener("click",e=>{const b=e.target.closest("button");if(b){vf=b.dataset.k;renderVideos()}});
$("galChips").addEventListener("click",e=>{const b=e.target.closest("button");if(b){gf=b.dataset.k;renderGal()}});
$("gal").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const p=PHOTOS[+b.dataset.i];
 $("lbImg").src=p.img;$("lbImg").alt=p[L];$("lbCap").textContent=p[L];$("lb").classList.add("on");$("lbX").focus()});
const closeLb=()=>$("lb").classList.remove("on");
$("lbX").addEventListener("click",closeLb);
$("lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb()});
render();
}
