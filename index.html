<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RC Days Riyadh</title>
<meta name="description" content="Discover RC Days Riyadh, a community celebrating radio-controlled cars, racing, drift, off-road activities, competitions, and unforgettable community events.">
<meta name="description" lang="ar" content="اكتشف RC Days Riyadh، مجتمع شغوف بعالم السيارات اللاسلكية والسباقات والدرفت والأوف رود والفعاليات والتجمعات.">
<meta property="og:title" content="RC Days Riyadh — Small cars. Big passion.">
<meta property="og:description" content="Discover RC Days Riyadh, a community celebrating radio-controlled cars, racing, drift, off-road activities, competitions, and unforgettable community events.">
<meta property="og:type" content="website">
<meta property="og:image" content="img/logo.png">
<meta name="theme-color" content="#0d0d0e">
<link rel="icon" href="img/logo-160.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: motorsport magazine — loud headline, calm body, every fact traced to an RC Days post.
   IDEA: a race programme: a contents page of sections up front, then each section's content right under its heading.
   PICTURE: RC Days' own poster and paddock photos, in swipeable strips like a pit-lane contact sheet.
   COLOUR and TYPE: matte black + charcoal, white ink, racing red, logo blue as a small second accent; Barlow Condensed / Cairo.
   LAYOUT: compact hero with section tiles, sticky nav (bottom bar on phones), full-bleed bands, horizontal rails, a schedule table. */
:root{color-scheme:dark;--bg:#0d0d0e;--panel:#151518;--card:#111113;--line:#2a2a2f;--ink:#f4f4f2;--mute:#a3a3a8;--red:#e3122d;--red2:#ff4458;--blue:#3d8bff;--gold:#ffd166;
--disp:"Barlow Condensed","Cairo",Impact,sans-serif;--body:"Barlow","Cairo",system-ui,sans-serif}
:root[dir=rtl]{--disp:"Cairo","Barlow Condensed",sans-serif;--body:"Cairo",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);overflow-x:clip}
a{color:inherit}
img{max-width:100%;display:block}
.band{padding:clamp(40px,6vw,80px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--disp);line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(42px,7.5vw,92px);font-weight:800;text-transform:uppercase}
[dir=rtl] h1{text-transform:none;line-height:1.25}
h2{font-size:clamp(30px,4.6vw,48px);font-weight:800}
[dir=rtl] h2{line-height:1.3}
h3{font-size:22px;font-weight:600}
[dir=rtl] h3{line-height:1.4}
p{margin:.5em 0;max-width:66ch}
.mute{color:var(--mute)}
.kick{font-family:var(--disp);color:var(--red2);font-size:17px;font-weight:600;margin:0 0 8px}
:focus-visible{outline:3px solid var(--red2);outline-offset:2px}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(13,13,14,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;max-width:1240px;margin:0 auto;padding:8px max(5vw,16px)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo img{width:46px;height:46px}
.logo b{font:800 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.02em}
.links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.links a{flex:none;text-decoration:none;padding:10px 12px;border-radius:8px;color:var(--mute);font-weight:600;font-size:15px}
.links a:hover,.links a:focus-visible,.links a.on{color:var(--ink);background:var(--panel)}
.lang{flex:none;margin-inline-start:auto;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);font:600 16px var(--body);cursor:pointer}
.lang:hover{background:var(--ink);color:var(--bg)}
@media(max-width:860px){header{backdrop-filter:none;background:#0d0d0e}
 .links{position:fixed;inset:auto 0 0 0;background:#0d0d0e;border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:30}
 body{padding-bottom:64px}}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start;padding-top:clamp(20px,3.5vw,52px)}
.tagline{display:inline-block;font:italic 600 15px "Barlow",sans-serif;color:var(--blue);margin-bottom:6px}
.lede{font-size:clamp(17px,1.8vw,20px);color:#d8d8da;margin-top:12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:26px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:96px;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-decoration:none;transition:border-color .2s,transform .2s}
.tile:hover,.tile:focus-visible{border-color:var(--red);transform:translateY(-2px)}
.tile svg{width:26px;height:26px;stroke:var(--red2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:16px;line-height:1.25}
.tile small{display:block;color:var(--mute);font-size:13px;font-weight:400}
.tile.hot{background:linear-gradient(160deg,#3a0b13,var(--panel) 70%);border-color:#5a1420}
@media(max-width:600px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:84px}}
.collage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:1fr 1fr;gap:10px;aspect-ratio:1/1.02}
.collage figure{margin:0;position:relative;border-radius:16px;overflow:hidden;background:#1d1d21}
.collage figure:first-child{grid-row:span 2}
.collage img{width:100%;height:100%;object-fit:cover;animation:rise .9s ease-out both}
.collage figure:nth-child(2) img{animation-delay:.12s}.collage figure:nth-child(3) img{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:scale(1.06)}}
.chip{position:absolute;inset-block-end:10px;inset-inline-start:10px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.72);color:#fff}
@media(max-width:860px){.hero{grid-template-columns:1fr}.collage{display:none}}
/* sections */
.alt{background:var(--panel)}
.alt .tile{background:var(--card)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px 16px;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.head p{margin:4px 0 0;color:var(--mute);font-size:15px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:start}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.list{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.list li{padding:12px 16px;border-inline-start:3px solid var(--red);background:var(--bg);border-radius:0 10px 10px 0}
[dir=rtl] .list li{border-radius:10px 0 0 10px}
.badgeLogo{width:min(220px,60%);margin:0 auto 20px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
.draft{border:1px dashed #5a5a60;border-radius:16px;padding:20px}
.badge{display:inline-block;font-size:13px;font-weight:600;background:#3a2a00;color:var(--gold);padding:3px 10px;border-radius:999px;margin-bottom:8px}
.ph{color:var(--gold)}
/* rails */
.rnav{display:flex;gap:8px}
.rnav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.rnav button:hover{border-color:var(--ink)}
.rnav button:disabled{opacity:.3;cursor:default}
.rnav svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
[dir=rtl] .rnav svg{transform:scaleX(-1)}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:min(80%,300px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;padding:2px 2px 14px;scrollbar-width:thin;scrollbar-color:#3a3a40 transparent}
.track>*{scroll-snap-align:start}
.track.wide{grid-auto-columns:min(86%,360px)}
.track.photos{grid-auto-columns:min(66%,250px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none}
.band:not(.alt) .card{background:var(--panel)}
.card .pic{aspect-ratio:4/3;background:#1d1d21;position:relative}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card .in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .in p{margin:0;color:#cfcfd2;font-size:15px}
.go{margin-top:auto;padding-top:10px;color:var(--red2);font-weight:600;text-decoration:none;font-size:15px}
.go:hover{text-decoration:underline}
.meta{font-size:14px;color:var(--mute)}
/* past event cards */
.ev .pic{aspect-ratio:4/5}
.ev .pic img{object-position:top}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;margin:2px 0;font-size:14px}
.facts dt{color:var(--mute)}.facts dd{margin:0}
/* schedule */
.demoNote{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:12px;background:#2a2100;border:1px solid #5c4a10;color:var(--gold);font-size:15px;margin-bottom:16px}
.demoNote svg{flex:none;width:20px;height:20px;margin-top:3px;stroke:currentColor;fill:none;stroke-width:2}
.sched{display:grid;gap:12px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,.9fr) auto;gap:18px;align-items:center;padding:16px 18px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.row.next{border-color:var(--red);background:linear-gradient(100deg,#2b0a10 0%,var(--card) 55%);box-shadow:0 0 0 1px var(--red) inset}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:96px;height:96px;border-radius:14px;background:var(--bg);border:1px solid var(--line);text-align:center;line-height:1.05}
.row.next .date{background:var(--red);border-color:var(--red)}
.date small{font-size:13px;font-weight:600;color:var(--mute)}
.row.next .date small{color:#ffe0e4}
.date b{font:800 40px/1 var(--disp)}
.when{display:grid;gap:4px;font-size:15px}
.when span{display:flex;gap:8px;align-items:center}
.when svg{flex:none;width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#26262b;color:var(--ink)}
.tag.next{background:var(--red);color:#fff}
.tag.demo{background:#3a2a00;color:var(--gold)}
.cd{font:800 22px/1 var(--disp);color:var(--ink);text-align:center;white-space:nowrap}
.cd small{display:block;font:600 12px var(--body);color:var(--mute);margin-top:4px}
@media(max-width:760px){.row{grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:start}.date{width:72px;height:80px}.date b{font-size:32px}.when,.cd{grid-column:2}.cd{text-align:start}}
.empty{border:1px solid var(--line);border-radius:20px;padding:clamp(24px,5vw,48px);text-align:center;background:radial-gradient(120% 140% at 50% 0%,#2a0d12 0%,var(--bg) 60%)}
.empty p{margin:0 auto 18px;font-size:clamp(20px,2.4vw,24px);font-family:var(--disp);font-weight:600}
.ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;text-decoration:none;border:1px solid var(--line)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost:hover{border-color:var(--ink)}
/* videos & gallery */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chips button{min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mute);font:600 15px var(--body);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vid .pic{aspect-ratio:16/9}
.vid .play{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:rgba(227,18,45,.92);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(227,18,45,.22)}
.vid:hover .play{background:var(--red2)}
.vid h3{font-size:18px;font-family:"Cairo",sans-serif;line-height:1.5}
.shot{border:0;padding:0;border-radius:14px;overflow:hidden;background:#1d1d21;cursor:zoom-in;aspect-ratio:4/5;position:relative}
.shot img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.shot:hover img{transform:scale(1.04)}
.shot span{position:absolute;inset-inline:0;inset-block-end:0;padding:24px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;font-size:14px;font-weight:600;text-align:start}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;place-items:center;z-index:50;padding:20px}
.lb.on{display:grid}
.lb figure{margin:0;max-width:min(900px,100%);display:flex;flex-direction:column;gap:10px}
.lb img{max-height:80vh;width:auto;margin:0 auto;border-radius:12px}
.lb figcaption{text-align:center;color:#ddd}
.lb .x{position:absolute;inset-block-start:16px;inset-inline-end:16px;width:48px;height:48px;border-radius:50%;border:1px solid #555;background:#111;color:#fff;font-size:24px;cursor:pointer}
.soc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.soc a,.soc div{display:flex;align-items:center;gap:16px;padding:20px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-decoration:none}
.soc a:hover{border-color:var(--red)}
.soc svg{width:40px;height:40px;flex:none}
.soc b{display:block;font-size:19px}
.soc div{border-style:dashed}
footer{padding:32px max(5vw,16px);border-top:1px solid var(--line);color:var(--mute);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
@media(prefers-reduced-motion:reduce){.collage img{animation:none}html{scroll-behavior:auto}.tile,.shot img{transition:none}}
</style>
</head>
<body>
<header>
 <div class="bar">
  <a class="logo" href="#home" aria-label="RC Days Riyadh"><img src="img/logo-160.png" alt="RC Days logo" width="46" height="46"><b>RC DAYS</b></a>
  <nav class="links" id="nav" aria-label="Sections"></nav>
  <button class="lang" id="lang" type="button" lang="ar">العربية</button>
 </div>
</header>

<main>
<section class="band" id="home">
 <div class="wrap hero">
  <div>
   <span class="tagline">we are PROFESSIONALS</span>
   <p class="kick" data-t="heroKick"></p>
   <h1 data-t="heroTitle"></h1>
   <p class="lede" data-t="heroLede"></p>
   <nav class="tiles" id="tiles" aria-label="Sections"></nav>
  </div>
  <div class="collage">
   <figure><img src="img/poster-sand-hill.jpg" data-alt="altSandHill"></figure>
   <figure><img src="img/g-drift-car.jpg" data-alt="altDrift"><span class="chip" data-t="chipDrift"></span></figure>
   <figure><img src="img/g-land-cruiser-crawler.jpg" data-alt="altCrawler"><span class="chip" data-t="chipCrawler"></span></figure>
  </div>
 </div>
</section>

<section class="band alt" id="upcoming">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="upKick"></p><h2 data-t="upTitle"></h2><p data-t="upSub"></p></div></div>
  <div id="upList"></div>
 </div>
</section>

<section class="band" id="about">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="aboutKick"></p><h2 data-t="aboutTitle"></h2></div></div>
  <div class="two">
   <div>
    <p data-t="aboutP1"></p>
    <p data-t="aboutP2"></p>
    <ul class="list" id="doList"></ul>
   </div>
   <div>
    <img class="badgeLogo" src="img/logo.png" alt="RC Days official logo — we are PROFESSIONALS">
    <div class="draft">
     <span class="badge" data-t="draftBadge"></span>
     <h3 data-t="visionT"></h3>
     <p data-t="visionP"></p>
     <h3 style="margin-top:14px" data-t="valuesT"></h3>
     <ul class="list" id="values"></ul>
    </div>
   </div>
  </div>
 </div>
</section>

<section class="band alt" id="activities">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="actKick"></p><h2 data-t="actTitle"></h2><p data-t="actNote"></p></div><div class="rnav" data-for="acts"></div></div>
  <div class="track" id="acts"></div>
 </div>
</section>

<section class="band" id="past">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="pastKick"></p><h2 data-t="pastTitle"></h2><p data-t="pastSub"></p></div><div class="rnav" data-for="pastList"></div></div>
  <div class="track wide" id="pastList"></div>
 </div>
</section>

<section class="band alt" id="videos">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="vidKick"></p><h2 data-t="vidTitle"></h2><p><a class="go" style="padding:0" href="https://www.youtube.com/@RC_days/videos" target="_blank" rel="noopener" data-t="vidAll"></a></p></div><div class="rnav" data-for="vidList"></div></div>
  <div class="chips" id="vidChips" role="group"></div>
  <div class="track wide" id="vidList"></div>
 </div>
</section>

<section class="band" id="gallery">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="galKick"></p><h2 data-t="galTitle"></h2><p data-t="galNote"></p></div><div class="rnav" data-for="gal"></div></div>
  <div class="chips" id="galChips" role="group"></div>
  <div class="track photos" id="gal"></div>
 </div>
</section>

<section class="band alt" id="community">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="comKick"></p><h2 data-t="comTitle"></h2></div></div>
  <div class="two">
   <div><p data-t="comP"></p><p class="mute" data-t="comPrivacy"></p></div>
   <ul class="list" id="comList" style="margin:0"></ul>
  </div>
 </div>
</section>

<section class="band" id="contact">
 <div class="wrap">
  <div class="head"><div><p class="kick" data-t="conKick"></p><h2 data-t="conTitle"></h2><p data-t="conNote"></p></div></div>
  <div class="soc">
   <a href="https://www.instagram.com/rc_days" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="#f4f4f2" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1" fill="#e3122d" stroke="none"/></svg><span><b>Instagram</b><span class="mute">@rc_days</span></span></a>
   <a href="https://www.youtube.com/@RC_days" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path fill="#e3122d" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .6 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .4-4.8 31 31 0 0 0-.4-4.8z"/><path fill="#fff" d="M9.8 15.1 15.6 12 9.8 8.9z"/></svg><span><b>YouTube</b><span class="mute">@RC_days</span></span></a>
   <div><svg viewBox="0 0 24 24" fill="none" stroke="#a3a3a8" stroke-width="1.8"><path d="M4 20l1.3-4A8 8 0 1 1 8 18.7Z"/></svg><span><b>WhatsApp</b><span class="ph" data-t="waPh"></span></span></div>
  </div>
 </div>
</section>
</main>

<footer><div class="wrap"><span data-t="footC"></span><span data-t="footImg"></span></div></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true"><figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure><button class="x" id="lbX" type="button" aria-label="Close">×</button></div>

<script>
{
/* ===================== EDIT CONTENT HERE =====================
   UPCOMING: add confirmed events with date:"YYYY-MM-DDTHH:MM" (Riyadh time). The schedule sorts them by date,
   hides any that have passed, and highlights the nearest one automatically.
   demo:true marks a preview-only event: DELETE BOTH DEMO EVENTS before announcing real ones.
   PAST: leave a field "" when not confirmed — a yellow "to be confirmed" placeholder appears.
   VIDEOS: paste a video's 11-character ID into id:"" — until then the card opens the channel's video list. */
const UPCOMING=[

  <div class="cd">${esc(cd)}</div></article>`}).join("")}</div>`}

function renderVideos(){const t=T[L];chips("vidChips",t.vcats,vf);
 $("vidList").innerHTML=VIDEOS.filter(v=>vf==="all"||v.cat===vf).map(v=>`<a class="card vid" href="${v.id?"https://www.youtube.com/watch?v="+encodeURIComponent(v.id):"https://www.youtube.com/@RC_days/videos"}" ${ext}><div class="pic">${v.img?`<img src="${v.img}" alt="${esc(v[L])}" loading="lazy">`:""}<span class="play"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M8 5v14l11-7z" fill="#fff"/></svg></span></div><div class="in"><h3 lang="ar" dir="rtl">${esc(v.ar)}</h3>${L==="en"?`<p class="mute">${esc(v.en)}</p>`:""}<p class="meta">${v.len?esc(v.len)+" · ":""}${esc(t.vcats[v.cat])}</p></div></a>`).join("");
 resetRail("vidList")}
function renderGal(){const t=T[L];chips("galChips",t.gcats,gf);
 $("gal").innerHTML=PHOTOS.map((p,i)=>({p,i})).filter(o=>gf==="all"||o.p.cat===gf).map(({p,i})=>`<button type="button" class="shot" data-i="${i}"><img src="${p.img}" alt="${esc(p[L])}" loading="lazy"><span>${esc(p[L])}</span></button>`).join("");
 resetRail("gal")}
function chips(el,cats,cur){$(el).innerHTML=Object.keys(cats).map(k=>`<button type="button" data-k="${k}" aria-pressed="${k===cur}">${esc(cats[k])}</button>`).join("")}

/* rails: prev/next buttons, keyboard arrows, RTL-aware */
function railStep(tr,dir){const rtl=document.documentElement.dir==="rtl";tr.scrollBy({left:dir*(rtl?-1:1)*tr.clientWidth*.85,behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
function updRail(id){const tr=$(id),nav=document.querySelector(`.rnav[data-for="${id}"]`);if(!tr||!nav)return;const max=tr.scrollWidth-tr.clientWidth,pos=Math.abs(tr.scrollLeft),[p,n]=nav.querySelectorAll("button");if(p){p.disabled=pos<=2;n.disabled=pos>=max-2;nav.style.visibility=max>4?"visible":"hidden"}}
function resetRail(id){const tr=$(id);if(tr){tr.scrollLeft=0;requestAnimationFrame(()=>updRail(id))}}
document.querySelectorAll(".rnav").forEach(nav=>{const id=nav.dataset.for,tr=$(id);
 nav.innerHTML=`<button type="button" data-d="-1"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button type="button" data-d="1"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>`;
 nav.addEventListener("click",e=>{const b=e.target.closest("button");if(b)railStep(tr,+b.dataset.d)});
 tr.addEventListener("scroll",()=>updRail(id),{passive:true});
 tr.tabIndex=0;tr.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();const rtl=document.documentElement.dir==="rtl";railStep(tr,(e.key==="ArrowRight")!==rtl?1:-1)}});
});
const railObs=new ResizeObserver(()=>["acts","pastList","vidList","gal"].forEach(updRail));railObs.observe(document.body);

function render(){
 const t=T[L];
 document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
 document.title=L==="ar"?"RC Days Riyadh | ارسي دايز الرياض":"RC Days Riyadh";
 document.querySelectorAll("[data-t]").forEach(el=>{const k=el.dataset.t;if(typeof t[k]==="string")el.textContent=t[k]});
 document.querySelectorAll("[data-alt]").forEach(el=>el.alt=t[el.dataset.alt]);
 $("lang").textContent=t.langBtn;$("lang").lang=L==="ar"?"en":"ar";
 $("nav").innerHTML=navIds.map((id,i)=>`<a href="#${id}" data-id="${id}">${esc(t.nav[i])}</a>`).join("");
 const n=upcoming().length;
 $("tiles").innerHTML=tileIds.map(id=>{const [h,s]=t.tiles[id];return `<a class="tile${id==="upcoming"&&n?" hot":""}" href="#${id}">${svg(id)}<b>${esc(h)}<small>${esc(s.replace("{n}",L==="ar"?n.toLocaleString("ar-SA"):n))}</small></b></a>`}).join("");
 for(const k of ["doList","values","comList"])$(k).innerHTML=t[k].map(s=>`<li>${esc(s)}</li>`).join("");
 $("acts").innerHTML=t.acts.map(([img,h,p])=>`<article class="card"><div class="pic"><img src="${img}" alt="${esc(h)}" loading="lazy"></div><div class="in"><h3>${esc(h)}</h3><p>${esc(p)}</p><a class="go" href="https://www.instagram.com/rc_days" ${ext}>${esc(t.follow)}</a></div></article>`).join("")
  +`<article class="card" style="border-style:dashed;background:transparent"><div class="in"><h3>${esc(t.alsoT)}</h3><p>${esc(t.alsoP)}</p><a class="go" href="https://www.youtube.com/@RC_days" ${ext}>${esc(t.watch)}</a></div></article>`;
 $("pastList").innerHTML=PAST.map(e=>{const x=e[L],v=s=>s?esc(s):`<span class="ph">${esc(t.tbc)}</span>`;return `<article class="card ev"><div class="pic"><img src="${e.img}" alt="${esc(x.t)}" loading="lazy"></div><div class="in"><h3>${esc(x.t)}</h3><dl class="facts"><dt>${esc(t.fDate)}</dt><dd>${v(x.date)}</dd><dt>${esc(t.fLoc)}</dt><dd>${v(x.loc)}</dd>${x.classes?`<dt>${esc(t.fClass)}</dt><dd>${esc(x.classes)}</dd>`:""}<dt>${esc(t.fRes)}</dt><dd>${x.res?esc(x.res):`<span class="ph">${esc(t.resPh)}</span>`}</dd></dl><p>${esc(x.d)}</p><a class="go" href="${esc(e.link)}" ${ext}>${esc(e.src==="yt"?t.srcYt:t.srcIg)}</a></div></article>`}).join("");
 renderUpcoming();renderVideos();renderGal();
 document.querySelectorAll(".rnav").forEach(nav=>{const [p,nx]=nav.querySelectorAll("button");p.setAttribute("aria-label",t.prev);nx.setAttribute("aria-label",t.next)});
 ["acts","pastList"].forEach(resetRail);
 $("lbX").setAttribute("aria-label",t.close);
}
function setLang(n){const y=window.scrollY;L=n;try{localStorage.setItem("rcdays-lang",n)}catch(e){}render();window.scrollTo(0,y)}
$("lang").addEventListener("click",()=>setLang(L==="en"?"ar":"en"));
$("vidChips").addEventListener("click",e=>{const b=e.target.closest("button");if(b){vf=b.dataset.k;renderVideos()}});
$("galChips").addEventListener("click",e=>{const b=e.target.closest("button");if(b){gf=b.dataset.k;renderGal()}});
$("gal").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const p=PHOTOS[+b.dataset.i];
 $("lbImg").src=p.img;$("lbImg").alt=p[L];$("lbCap").textContent=p[L];$("lb").classList.add("on");$("lbX").focus()});
const closeLb=()=>$("lb").classList.remove("on");
$("lbX").addEventListener("click",closeLb);
$("lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb()});
/* highlight the section in view in the top/bottom nav */
const secObs=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.id===en.target.id))}})},{rootMargin:"-45% 0px -50% 0px"});
navIds.forEach(id=>secObs.observe($(id)));
render();
}
</script>
</body>
</html>
